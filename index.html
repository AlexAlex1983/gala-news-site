<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALA Health — News &amp; Research</title>
<meta name="description" content="News, research, and publications from GALA Health — global policy work on chronic respiratory disease.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="wordmark" href="https://galahealth.org"><img src="logo.png" alt="GALA Health" class="logo-img"></a>
    <span class="section-tag">News &amp; Research</span>
    <a class="back-link" href="https://galahealth.org">← Main site</a>
  </div>
</header>

<svg class="breath-line" viewBox="0 0 1200 60" preserveAspectRatio="none" aria-hidden="true">
  <path id="breathPath" d="M0,30 L1200,30" />
</svg>

<section class="hero">
  <div class="wrap">
    <p class="eyebrow mono">Latest signal</p>
    <h1 id="heroTitle" class="hero-title">Loading…</h1>
    <p id="heroSummary" class="hero-summary"></p>
    <p id="heroDate" class="mono hero-date"></p>
  </div>
</section>

<svg class="breath-line" viewBox="0 0 1200 60" preserveAspectRatio="none" aria-hidden="true">
  <path class="breathPath2" d="M0,30 L1200,30" />
</svg>

<main class="wrap">

  <section class="block" id="news">
    <h2 class="block-title">News</h2>
    <div id="newsList" class="news-list"></div>
  </section>

  <section class="block" id="publications">
    <h2 class="block-title">Publications</h2>
    <div id="pubList" class="pub-list"></div>
  </section>

  <section class="block" id="social">
    <h2 class="block-title">On X</h2>
    <div class="x-embed-frame">
      <a class="twitter-timeline" data-height="600" data-theme="light" href="https://twitter.com/GALA_Health?ref_src=twsrc%5Etfw">Posts by @GALA_Health</a>
      <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>GALA Health · Geneva</p>
    <a href="https://galahealth.org/contact">Contact</a>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
